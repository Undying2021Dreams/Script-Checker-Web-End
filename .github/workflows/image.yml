name: Image

# Builds the deployable container image and publishes it to the GitHub
# Container Registry.
#
# This does not run on a developer machine on purpose. The image has to
# be linux/amd64 (Azure Container Apps runs nothing else), and the
# machine this project is developed on is arm64 — building there means
# QEMU emulation for OpenCV and Chromium, and then pushing well over a
# gigabyte up a home connection. A runner is already amd64 and sits next
# to the registry, so both problems disappear.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Supplied by Actions itself — no secret needs configuring.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/undying2021dreams/script-checker-web-end:latest
            ghcr.io/undying2021dreams/script-checker-web-end:${{ github.sha }}
          # Entra's client id is read by Vite at build time and baked
          # into the bundle. A public SPA client id is not a secret —
          # anyone who opens the page can read it — so it lives here
          # rather than in repository secrets.
          build-args: |
            VITE_AZURE_CLIENT_ID=08409bfc-af77-447a-9389-3466a29ea9dd
            VITE_AZURE_TENANT_ID=common
            VITE_AZURE_API_SCOPE=api://08409bfc-af77-447a-9389-3466a29ea9dd/access_as_user
          cache-from: type=gha
          cache-to: type=gha,mode=max
