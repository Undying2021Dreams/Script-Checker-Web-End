<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover so a standalone launch can paint under the
         notch and home indicator; the safe-area insets in index.css keep
         content out from under them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AutoCheck — automated script checking</title>

    <!-- Installable on a phone: home-screen icon, own window, no browser
         chrome. A student photographing a script is the whole point of
         this on mobile, and a page behind an address bar does not read
         as something you open to do that. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AutoCheck" />
    <!-- iOS reads this once at launch and cannot follow a theme change,
         so it is the light ground rather than either theme's colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#2b7de9" />

    <!-- The link-preview card. Sent to a supervisor or pasted into a
         chat, the URL otherwise renders as a bare address with no
         indication of what it is. og:image does not reliably accept
         SVG, so this one asset has to be a raster. -->
    <meta property="og:title" content="AutoCheck" />
    <meta property="og:description" content="Automated exam-script checking — author a paper, collect answers, mark them against your own scheme." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Automated exam-script checking — author a paper, collect answers, mark them against your own scheme." />
  </head>
  <body>
    <script>
      // Inline and synchronous on purpose: run as a module or after the
      // bundle and the page paints light first, then jumps.
      try {
        var t = localStorage.getItem('webend-theme') || 'system'
        var dark = t === 'dark' ||
          (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registered only in a real deployment. Under Vite's dev server a
      // service worker intercepting module requests makes hot reload
      // behave unpredictably, and the install prompt is not what anyone
      // is testing at localhost.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // Not being installable is a missing nicety, not a fault:
            // the site works exactly the same without it.
          })
        })
      }
    </script>
  </body>
</html>
