        stroke="#2b7de9" stroke-width="4" stroke-linejoin="round"/>
  <path d="M27 8V14A5 5 0 0 0 32 19H38" stroke="#2b7de9" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M16 24H27" stroke="#2b7de9" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M16 40L23 47L36 32" stroke="#2da97c" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
