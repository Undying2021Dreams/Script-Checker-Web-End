<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deliberately simpler than the in-app mark: the circuit traces are
       dropped because at the 16px a favicon is actually rendered at they
       are well under a pixel wide and read as noise, not circuitry.
       Colours are fixed here rather than themed — a favicon is drawn by
       the browser, outside the page's stylesheet. -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
